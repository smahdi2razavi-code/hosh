<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#170f3d">
<meta name="mobile-web-app-capable" content="yes">
<title>سلطان معما</title>
<style>
/* ==================================================================
   سلطان معما — بازی پازل فارسی
   کل بازی در همین یک فایل است (بدون وابستگی به اینترنت)
   ================================================================== */
@font-face{font-family:'Vazir';src:url('vazir.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Vazir';src:url('vazir-bold.ttf') format('truetype');font-weight:700;font-display:swap}

:root{
  --bg1:#2a1c6b; --bg2:#150e35; --bg3:#3b1d63;
  --card:rgba(255,255,255,.085);
  --card2:rgba(255,255,255,.15);
  --line:rgba(255,255,255,.14);
  --txt:#fff; --dim:rgba(255,255,255,.60);
  --gold:#FFC94A; --pink:#FF5D8F; --cyan:#2FD8D0;
  --green:#43D97B; --red:#FF6060; --violet:#9B6BFF; --blue:#4C9BFF;
  --r:20px;
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{
  font-family:'Vazir',Tahoma,'Segoe UI',Roboto,sans-serif;
  background:var(--bg2);color:var(--txt);
  font-size:15px;line-height:1.7;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
#app{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;
  background:
    radial-gradient(120% 80% at 80% 0%, var(--bg3) 0%, rgba(0,0,0,0) 60%),
    radial-gradient(110% 70% at 10% 100%, #1d3c7a 0%, rgba(0,0,0,0) 55%),
    linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
}
b{font-weight:700}

/* ---------- صفحه‌ها ---------- */
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;
  flex-direction:column;padding:calc(10px + var(--safeT)) 12px calc(10px + var(--safeB));
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen.on{display:flex;animation:scrIn .26s cubic-bezier(.2,.8,.3,1)}
.screen.nofit{overflow:hidden}
@keyframes scrIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- عناصر پایه ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:18px;padding:14px 16px;font:inherit;font-weight:700;
  color:#1a1030;background:linear-gradient(180deg,#fff,#e8e6f5);
  box-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 20px rgba(0,0,0,.25);
  transition:transform .09s ease,box-shadow .09s ease;cursor:pointer;font-size:16px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18),0 6px 12px rgba(0,0,0,.25)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.p{background:linear-gradient(180deg,#FFD86B,#F5A623);color:#4a2a00}
.btn.v{background:linear-gradient(180deg,#A98BFF,#7A4BF0);color:#fff}
.btn.c{background:linear-gradient(180deg,#5FE7E0,#1FB6AE);color:#053b39}
.btn.g{background:linear-gradient(180deg,#6BE79A,#25B45E);color:#05351a}
.btn.k{background:linear-gradient(180deg,#FF87AC,#EE3E75);color:#fff}
.btn.b{background:linear-gradient(180deg,#79B6FF,#2C74E0);color:#fff}
.btn.ghost{background:var(--card2);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.sm{padding:10px 12px;font-size:14px;border-radius:14px}
.big{font-size:19px;padding:17px}
.ico{width:42px;height:42px;flex:0 0 42px;border-radius:14px;border:1px solid var(--line);
  background:var(--card2);color:#fff;font-size:19px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-family:inherit;padding:0}
.ico:active{transform:scale(.93)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.dim{color:var(--dim)}
.center{text-align:center}
.mt{margin-top:12px}
.hr{height:1px;background:var(--line);margin:10px 0}

/* ---------- صفحه اصلی ---------- */
.logoBox{text-align:center;padding:2px 0 0;flex:0 0 auto}
.crown{font-size:38px;line-height:1;filter:drop-shadow(0 6px 12px rgba(255,190,60,.45));
  animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.logo{font-size:30px;font-weight:700;line-height:1.25;margin-top:0;
  background:linear-gradient(180deg,#FFF0B8,#FFB627 60%,#FF7A45);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;text-shadow:0 6px 18px rgba(255,150,40,.25)}
.slogan{color:var(--dim);font-size:13px;margin-top:-2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:8px 4px;text-align:center}
.stat .v{font-size:18px;font-weight:700;line-height:1.3}
.stat .l{font-size:11px;color:var(--dim)}
.stat.coin .v{color:var(--gold)} .stat.sc .v{color:var(--cyan)} .stat.lv .v{color:var(--pink)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.menu .full{grid-column:1/-1}
.mbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;border:none;border-radius:20px;padding:11px 8px;font:inherit;font-weight:700;
  color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2),0 10px 18px rgba(0,0,0,.25);
  transition:transform .09s ease}
.mbtn:active{transform:translateY(4px)}
.mbtn .e{font-size:24px;line-height:1.15}
.mbtn .t{font-size:15px}
.mbtn .s{font-size:11px;opacity:.8;font-weight:400}
.m1{background:linear-gradient(160deg,#FF9A6B,#F0525A)}
.m2{background:linear-gradient(160deg,#7FE3FF,#2E7BE8)}
.m3{background:linear-gradient(160deg,#B58BFF,#6C34D8)}
.m4{background:linear-gradient(160deg,#FFD36B,#F08A1E)}
.m5{background:linear-gradient(160deg,#7AE6B0,#1E9E68)}
.m6{background:linear-gradient(160deg,#FF9ECF,#D6338B)}
.badge{position:absolute;top:-6px;left:-6px;background:var(--red);color:#fff;
  border-radius:12px;font-size:11px;font-weight:700;padding:1px 7px;
  box-shadow:0 3px 8px rgba(0,0,0,.35);animation:pop .5s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.livesHome{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:9px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px 10px;font-size:13px}

/* ---------- نوار بالای بازی ---------- */
.hud{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-bottom:8px}
.hudMid{flex:1;text-align:center;line-height:1.25}
.hudTitle{font-weight:700;font-size:17px}
.hudSub{font-size:11px;color:var(--dim)}
.timer{min-width:64px;text-align:center;background:var(--card2);border:1px solid var(--line);
  border-radius:14px;padding:7px 8px;font-weight:700;font-size:16px}
.timer.low{background:rgba(255,80,80,.25);border-color:rgba(255,80,80,.5);color:#ffd7d7;
  animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.statRow{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-bottom:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:5px 10px;font-size:12px;white-space:nowrap}
.chip b{font-size:14px}
.chip.ok b{color:var(--green)} .chip.warn b{color:var(--gold)}
.bar{flex:1;height:9px;border-radius:9px;background:rgba(0,0,0,.3);overflow:hidden;
  border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0%;border-radius:9px;
  background:linear-gradient(90deg,#43D97B,#2FD8D0);transition:width .35s ease}
.bar.thin{height:7px}
.bar.time i{background:linear-gradient(90deg,#FFC94A,#FF6060);transition:none}

/* ---------- صحنه‌های پیدا کردن تفاوت ---------- */
.scenes{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;min-height:0}
.scenes.wide{flex-direction:row}
.sceneWrap{position:relative;border-radius:16px;overflow:hidden;
  border:2px solid rgba(255,255,255,.22);box-shadow:0 8px 20px rgba(0,0,0,.35);background:#0b1020}
.sceneWrap svg{display:block;width:100%;height:100%}
.sceneWrap.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.tagNum{position:absolute;top:4px;right:6px;background:rgba(0,0,0,.45);color:#fff;
  font-size:11px;border-radius:8px;padding:0 7px}
.gbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-top:8px}
.coinBox{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:9px 12px;font-weight:700;color:var(--gold);white-space:nowrap}

/* افکت‌های داخل تصویر */
.mk{fill:none;stroke:#43D97B;stroke-width:3;animation:mkIn .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes mkIn{from{opacity:0;stroke-width:9;transform:scale(1.9);transform-origin:center}
  to{opacity:1;stroke-width:3;transform:scale(1)}}
.mkx{stroke:#FF6060;stroke-width:3.5;stroke-linecap:round;animation:fade .7s forwards}
@keyframes fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.hintRing{fill:none;stroke:#FFC94A;stroke-width:3;stroke-dasharray:6 5;
  animation:spin 2.4s linear infinite,pulseR 1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseR{0%,100%{opacity:.55}50%{opacity:1}}
.hintRing{transform-box:fill-box;transform-origin:center}

/* ---------- حدس تصویر ---------- */
.picWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 0}
.pic{position:relative;border-radius:24px;overflow:hidden;display:flex;align-items:center;
  justify-content:center;border:2px solid rgba(255,255,255,.25);
  box-shadow:0 12px 28px rgba(0,0,0,.4)}
.pic .em{font-size:96px;line-height:1;filter:blur(18px);transition:filter .25s linear;
  will-change:filter}
.pic .glow{position:absolute;top:0;right:0;bottom:0;left:0;
  background:radial-gradient(60% 60% at 50% 45%,rgba(255,255,255,.28),rgba(0,0,0,0) 70%)}
.tiles{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;
  grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.tiles i{background:rgba(14,9,38,.62);border:1px solid rgba(255,255,255,.05);
  transition:opacity .35s ease,transform .35s ease}
.tiles i.off{opacity:0;transform:scale(.5)}
.q{text-align:center;font-size:17px;font-weight:700;margin:8px 0;flex:0 0 auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:0 0 auto}
.opt{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  border-radius:16px;padding:13px 6px;font:inherit;font-size:15px;font-weight:700;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .09s}
.opt:active{transform:translateY(3px)}
.opt .oe{font-size:20px}
.opt.good{background:linear-gradient(180deg,#6BE79A,#25B45E);color:#04321a;
  animation:goodP .45s;border-color:transparent}
.opt.bad{background:linear-gradient(180deg,#FF8B8B,#E23A3A);color:#fff;
  animation:shake .35s;border-color:transparent}
.opt.gone{opacity:.25;pointer-events:none;text-decoration:line-through}
@keyframes goodP{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
.lives{display:flex;gap:2px;font-size:15px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:6px 8px}
.lives span{filter:grayscale(1);opacity:.35}
.lives span.on{filter:none;opacity:1}
.lives span.hit{animation:lifeHit .5s}
@keyframes lifeHit{0%{transform:scale(1.6)}100%{transform:scale(1)}}

/* ---------- مراحل ---------- */
.tabs{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:5px;flex:0 0 auto;margin-bottom:10px}
.tab{flex:1;border:none;background:transparent;color:var(--dim);font:inherit;font-weight:700;
  padding:9px;border-radius:12px;cursor:pointer;font-size:14px}
.tab.on{background:linear-gradient(180deg,#A98BFF,#7A4BF0);color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.3)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-bottom:10px}
.cell{position:relative;aspect-ratio:1/1;min-height:56px;border-radius:16px;border:1px solid var(--line);
  background:var(--card);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-direction:column;padding:0}
.cell.lock{opacity:.42;color:var(--dim)}
.cell.done{background:linear-gradient(160deg,#6BE79A,#22A45B);border-color:transparent;color:#04321a}
.cell.next{background:linear-gradient(160deg,#FFD86B,#F5A623);border-color:transparent;color:#4a2a00;
  box-shadow:0 0 0 3px rgba(255,201,74,.28)}
.cell.sp::after{content:'★';position:absolute;top:2px;left:5px;font-size:14px;color:var(--gold);
  text-shadow:0 2px 5px rgba(0,0,0,.5)}
.cell .st{font-size:9px;line-height:1;color:#ffe9a8;margin-top:1px}
.cell.done .st{color:#0a4a26}

/* ---------- رتبه‌بندی / پروفایل / مأموریت ---------- */
.rank{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:8px 10px;margin-bottom:7px}
.rank.me{background:linear-gradient(90deg,rgba(155,107,255,.45),rgba(76,155,255,.25));
  border-color:rgba(255,255,255,.35)}
.rank .no{width:30px;text-align:center;font-weight:700;color:var(--dim);flex:0 0 30px}
.rank .av{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-size:21px}
.rank .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sc{color:var(--cyan);font-weight:700}
.rank .no.g1{color:#FFD24A} .rank .no.g2{color:#D6E1EA} .rank .no.g3{color:#E7A96B}
.avPick{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:8px}
.avPick button{aspect-ratio:1/1;min-height:42px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);font-size:22px;cursor:pointer;padding:0}
.avPick button.on{background:linear-gradient(160deg,#A98BFF,#7A4BF0);border-color:transparent;
  box-shadow:0 0 0 3px rgba(169,139,255,.3)}
.inp{width:100%;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);
  color:#fff;font:inherit;font-size:16px;padding:11px 13px;text-align:right}
.inp:focus{outline:none;border-color:var(--violet)}
.kv{display:flex;justify-content:space-between;padding:7px 2px;font-size:14px}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{color:var(--dim)}
.msn{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:10px;margin-bottom:8px}
.msn .e{font-size:24px;flex:0 0 auto}
.msn .b{flex:1;min-width:0}
.msn .t{font-weight:700;font-size:14px}
.dayGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.day{border-radius:14px;border:1px solid var(--line);background:var(--card);padding:8px 3px;
  text-align:center;font-size:11px;position:relative}
.day .n{font-size:11px;color:var(--dim)}
.day .c{font-size:14px;font-weight:700;color:var(--gold);white-space:nowrap}
.day.got{background:rgba(67,217,123,.2);border-color:rgba(67,217,123,.45)}
.day.got::after{content:'✓';position:absolute;top:2px;left:5px;color:var(--green);font-weight:700}
.day.now{background:linear-gradient(160deg,#FFD86B,#F5A623);border-color:transparent;color:#4a2a00;
  animation:pulse 1.2s infinite}
.day.now .n,.day.now .c{color:#4a2a00}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.day.big{grid-column:span 2;background:linear-gradient(160deg,#FF9ECF,#D6338B);border-color:transparent}
.day.big .n,.day.big .c{color:#fff}

/* ---------- پنجره‌ها ---------- */
#modalRoot{position:absolute;top:0;right:0;bottom:0;left:0;display:none;z-index:40;
  align-items:center;justify-content:center;padding:18px;background:rgba(6,4,20,.72)}
#modalRoot.on{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:380px;max-height:88%;overflow-y:auto;border-radius:26px;padding:18px;
  background:linear-gradient(170deg,#3B2A80,#1E1550);border:1px solid rgba(255,255,255,.22);
  box-shadow:0 22px 50px rgba(0,0,0,.5);animation:mIn .3s cubic-bezier(.2,1.3,.4,1);text-align:center}
@keyframes mIn{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
.modal h2{margin:2px 0 6px;font-size:22px}
.modal .em{font-size:52px;line-height:1.2;margin-bottom:2px}
.modal .btns{display:grid;gap:9px;margin-top:14px}
.rw{display:flex;justify-content:center;gap:10px;margin:10px 0 2px;flex-wrap:wrap}
.rw div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;
  padding:7px 13px;font-weight:700}
.stars{font-size:32px;letter-spacing:4px;margin:6px 0}
.stars span{opacity:.25;display:inline-block}
.stars span.on{opacity:1;animation:starIn .45s backwards;color:var(--gold);
  text-shadow:0 4px 12px rgba(255,201,74,.6)}
.stars span.on:nth-child(2){animation-delay:.14s}
.stars span.on:nth-child(3){animation-delay:.28s}
@keyframes starIn{from{transform:scale(2.4) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}

/* ---------- توست و افکت ---------- */
#toast{position:absolute;left:0;right:0;bottom:calc(78px + var(--safeB));z-index:60;
  display:flex;justify-content:center;pointer-events:none}
#toast div{background:rgba(10,6,32,.94);border:1px solid var(--line);border-radius:16px;
  padding:9px 16px;font-size:14px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.4);
  animation:tIn .3s;max-width:86%}
@keyframes tIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#fx{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:70;overflow:hidden}
#fx i{position:absolute;width:9px;height:14px;border-radius:2px;animation:cf 1.5s linear forwards}
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(105vh) rotate(720deg);opacity:.15}}
.pts{position:absolute;font-weight:700;font-size:20px;color:var(--gold);pointer-events:none;
  animation:ptsUp 1s forwards;text-shadow:0 3px 10px rgba(0,0,0,.6)}
@keyframes ptsUp{0%{transform:translate(-50%,0);opacity:1}
  100%{transform:translate(-50%,-70px);opacity:0}}

/* ---------- درباره ما ---------- */
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px}
.brandMark{width:96px;height:96px;border-radius:28px;display:flex;align-items:center;
  justify-content:center;font-size:40px;font-weight:700;letter-spacing:1px;color:#1a1030;
  background:linear-gradient(160deg,#FFE9A8,#FFB627 55%,#FF7A45);
  box-shadow:0 12px 30px rgba(255,150,40,.35);cursor:pointer}
.brandName{font-size:26px;font-weight:700;margin-top:8px;
  background:linear-gradient(180deg,#FFF0B8,#FFB627);-webkit-background-clip:text;
  background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tagList{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.tagList span{background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:3px 10px;font-size:12px}

/* ---------- پنل مدیریت ---------- */
.aTabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;flex:0 0 auto;
  -webkit-overflow-scrolling:touch}
.aTabs::-webkit-scrollbar{display:none}

(function(){

var CRYPTO=(function(){

         0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
         0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
         0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
         0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
         0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

  function sha256(msg){

    var l=msg.length, blocks=Math.ceil((l+9)/64), total=blocks*64;
    var p=new Uint8Array(total), i, j;
    p.set(msg); p[l]=0x80;
    var bits=l*8, hi=Math.floor(bits/4294967296), lo=bits>>>0;
    p[total-8]=(hi>>>24)&255; p[total-7]=(hi>>>16)&255; p[total-6]=(hi>>>8)&255; p[total-5]=hi&255;
    p[total-4]=(lo>>>24)&255; p[total-3]=(lo>>>16)&255; p[total-2]=(lo>>>8)&255; p[total-1]=lo&255;
    var w=new Int32Array(64), a,b,c,d,e,f,g,h,t1,t2,s0,s1,ch,mj,o;
    for(i=0;i<blocks;i++){
      o=i*64;

      for(j=16;j<64;j++){
        s0=rotr(w[j-15],7)^rotr(w[j-15],18)^(w[j-15]>>>3);
        s1=rotr(w[j-2],17)^rotr(w[j-2],19)^(w[j-2]>>>10);
        w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
      }
      a=H[0];b=H[1];c=H[2];d=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
      for(j=0;j<64;j++){
        s1=rotr(e,6)^rotr(e,11)^rotr(e,25);
        ch=(e&f)^(~e&g);
        t1=(h+s1+ch+K[j]+w[j])|0;
        s0=rotr(a,2)^rotr(a,13)^rotr(a,22);
        mj=(a&b)^(a&c)^(b&c);
        t2=(s0+mj)|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    var out=new Uint8Array(32);
    for(i=0;i<8;i++){ out[i*4]=(H[i]>>>24)&255; out[i*4+1]=(H[i]>>>16)&255;

  }

    op.set(sha256(ip),64);

  }
  /* PBKDF2-HMAC-SHA256 با خروجی ۳۲ بایتی */
  function pbkdf2(pw,salt,iter){
    var s1=new Uint8Array(salt.length+4), i, j;

    s1[salt.length]=0; s1[salt.length+1]=0; s1[salt.length+2]=0; s1[salt.length+3]=1;

  }
  function str2b(s){
    var out=[], i, c;
    for(i=0;i<s.length;i++){
      c=s.charCodeAt(i);

  function same(a,b){

  }

    sha256hex:function(s){ return hex(sha256(str2b(s))); },

      return hex(pbkdf2(str2b(pw),salt,iter));
    },
    randHex:function(n){ return hex(rnd(n)); },
    same:same
  };
})();

/* ============================================================
   ۲-۲) لایه امنیتی پنل مدیریت
   ------------------------------------------------------------
   • رمز هرگز ذخیره نمی‌شود؛ فقط چکیده PBKDF2 با نمک تصادفی.
   • بعد از چند تلاش ناموفق، قفل زمانی فعال می‌شود (پایدار).
   • نشست پس از بی‌کاری خودکار بسته می‌شود.
   • همه کارهای مدیریتی در گزارش ثبت می‌شوند.
   ============================================================ */
var SEC=(function(){
  var KEY='sultan_sec_v1', ITER=15000;
  var D={ver:1,salt:'',hash:'',iter:ITER,rsalt:'',rhash:'',fails:0,lock:0,
         timeout:5,wipe:false,log:[],lastLogin:0};
  var session=0;
  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){ var o=JSON.parse(raw),k; for(k in D) if(o[k]!==undefined) D[k]=o[k]; }
    }catch(e){}
    if(!D.log) D.log=[];
  }
  function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){} }
  function log(act,detail){
    D.log.push({t:Date.now(),a:act,d:detail||''});
    if(D.log.length>200) D.log=D.log.slice(-200);
    persist();
  }
  /* هرچه تلاش ناموفق بیشتر، قفل طولانی‌تر */
  function lockMs(f){
    if(f<3) return 0;
    if(f<5) return 30*1000;
    if(f<7) return 5*60*1000;
    if(f<10) return 30*60*1000;
    return 60*60*1000;
  }
  return {
    init:load,
    isSet:function(){ return !!D.hash; },
    lockedFor:function(){ return Math.max(0,D.lock-Date.now()); },
    fails:function(){ return D.fails; },
    data:function(){ return D; },
    setPin:function(pin){
      D.salt=CRYPTO.randHex(16);
      D.iter=ITER;
      D.hash=CRYPTO.derive(pin,D.salt,D.iter);
      D.fails=0; D.lock=0;
      var rec=CRYPTO.randHex(5).toUpperCase();
      D.rsalt=CRYPTO.randHex(16);
      D.rhash=CRYPTO.derive(rec,D.rsalt,D.iter);
      persist(); log('تعیین رمز');
      return rec;                       /* کد بازیابی فقط همین یک‌بار نشان داده می‌شود */
    },
    check:function(pin){
      if(this.lockedFor()>0) return 'lock';
      var h=CRYPTO.derive(pin,D.salt,D.iter);
      if(CRYPTO.same(h,D.hash)){
        D.fails=0; D.lock=0; D.lastLogin=Date.now();
        session=Date.now(); persist(); log('ورود موفق');
        return 'ok';
      }
      D.fails++;
      D.lock=Date.now()+lockMs(D.fails);
      log('ورود ناموفق','تلاش '+D.fails);
      if(D.wipe && D.fails>=10){ D.hash=''; D.salt=''; persist(); log('پاک‌سازی امنیتی'); return 'wiped'; }
      persist();
      return 'bad';
    },
    recover:function(code){
      if(!D.rhash) return false;
      var h=CRYPTO.derive(String(code).toUpperCase().trim(),D.rsalt,D.iter);
      if(CRYPTO.same(h,D.rhash)){
        D.hash=''; D.salt=''; D.fails=0; D.lock=0; persist();
        log('بازیابی با کد پشتیبان');
        return true;
      }
      log('بازیابی ناموفق');
      return false;
    },

/* --- جان‌ها --- */
function regenLives(){
  if(S.lives>=CFG.MAX_LIVES){ S.lifeTs=Date.now(); return; }
  var now=Date.now();
  if(!S.lifeTs || S.lifeTs>now) S.lifeTs=now;
  while(S.lives<CFG.MAX_LIVES && now-S.lifeTs>=CFG.LIFE_MS){ S.lives++; S.lifeTs+=CFG.LIFE_MS; }
  if(S.lives>=CFG.MAX_LIVES) S.lifeTs=now;
}
function lifeLeftMs(){ regenLives(); if(S.lives>=CFG.MAX_LIVES) return 0;
  return Math.max(0, CFG.LIFE_MS-(Date.now()-S.lifeTs)); }
function loseLife(){ regenLives(); if(S.lives===CFG.MAX_LIVES) S.lifeTs=Date.now();
  S.lives=Math.max(0,S.lives-1); save(); }

/* ============================================================
   ۴) صدا (بدون فایل صوتی — با WebAudio ساخته می‌شود)
   ============================================================ */
var Sfx = (function(){
  var ctx=null, ok=true;
  function ac(){
    if(!ok) return null;
    try{
      if(!ctx){ var AC = window.AudioContext||window.webkitAudioContext;
        if(!AC){ ok=false; return null; } ctx=new AC(); }
      if(ctx.state==='suspended') ctx.resume();
      return ctx;
    }catch(e){ ok=false; return null; }
  }
  function tone(f1,f2,dur,type,vol,delay){
    if(!S.sound) return;
    var c=ac(); if(!c) return;
    try{
      var t=c.currentTime+(delay||0);
      var o=c.createOscillator(), g=c.createGain();
      o.type=type||'sine';
      o.frequency.setValueAtTime(f1,t);
      if(f2 && f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.16,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  }
  function buzz(){ tone(180,70,0.22,'sawtooth',0.13,0); }
  return {
    unlockAudio:function(){ ac(); },
    tap:function(){ tone(620,760,0.05,'triangle',0.06,0); },
    find:function(){ tone(700,1250,0.12,'triangle',0.14,0); tone(1250,1500,0.10,'sine',0.10,0.09); },
    correct:function(){ tone(523,523,0.10,'triangle',0.13,0); tone(659,659,0.10,'triangle',0.13,0.09);
      tone(784,784,0.16,'triangle',0.14,0.18); },
    wrong:function(){ buzz(); tone(140,90,0.25,'square',0.07,0.05); },
    coin:function(){ tone(1050,1050,0.06,'square',0.07,0); tone(1500,1500,0.09,'square',0.07,0.06); },
    win:function(){ var n=[523,659,784,1046],i;
      for(i=0;i<n.length;i++) tone(n[i],n[i],0.20,'triangle',0.14,i*0.11);
      tone(1318,1318,0.35,'sine',0.12,0.46); },
    lose:function(){ tone(400,180,0.5,'sawtooth',0.11,0); },
    unlockLvl:function(){ tone(880,880,0.10,'sine',0.12,0); tone(1174,1174,0.10,'sine',0.12,0.10);
      tone(1568,1568,0.24,'sine',0.13,0.20); }
  };
})();
function buzzz(ms){ try{ if(S.sound && navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

var toastT=null;
function toast(msg,ms){
  var box=$('#toast'); box.innerHTML='';
  box.appendChild(el('div',null,msg));
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(function(){ box.innerHTML=''; },ms||1600);
}
var modalOpen=false, modalLocked=false;
function modal(o){
  var root=$('#modalRoot');
  root.innerHTML='';
  var m=el('div','modal');
  var h='';
  if(o.emoji) h+='<div class="em">'+o.emoji+'</div>';
  if(o.title) h+='<h2>'+o.title+'</h2>';
  if(o.body)  h+='<div>'+o.body+'</div>';
  m.innerHTML=h;
  var bs=el('div','btns');
  (o.buttons||[]).forEach(function(b){
    var btn=el('button','btn '+(b.cls||'ghost'),b.t);
    btn.addEventListener('click',function(){
      Sfx.tap();
      if(!b.keep) closeModal();
      if(b.fn) b.fn();
    });
    bs.appendChild(btn);
  });
  m.appendChild(bs);
  root.appendChild(m);
  root.className='on';
  modalOpen=true; modalLocked=(o.dismiss===false);
  root.onclick=function(e){ if(e.target===root && o.dismiss!==false) closeModal(); };
  return m;
}
function closeModal(){ var r=$('#modalRoot'); r.className=''; r.innerHTML='';
  modalOpen=false; modalLocked=false; }

var CFC=['#FFC94A','#FF5D8F','#2FD8D0','#43D97B','#9B6BFF','#4C9BFF','#FF9A6B'];
function confetti(n){
  var fx=$('#fx'), i, p, W=fx.clientWidth||360;
  n=n||30;
  for(i=0;i<n;i++){
    p=el('i');
    p.style.background=CFC[i%CFC.length];
    p.style.left=(Math.random()*W)+'px';
    p.style.top=(-20-Math.random()*80)+'px';
    p.style.animationDelay=(Math.random()*0.35)+'s';
    p.style.animationDuration=(1.1+Math.random()*0.8)+'s';
    fx.appendChild(p);
  }
  setTimeout(function(){ fx.innerHTML=''; },2200);
}
function floatPts(x,y,txt,color){
  var fx=$('#fx'), p=el('div','pts',txt);
  p.style.left=x+'px'; p.style.top=y+'px';
  if(color) p.style.color=color;
  fx.appendChild(p);
  setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); },1000);
}

var curScreen='home', navStack=[];
var GATED={board:'leaderboard'};   /* صفحه‌هایی که به سرور نیاز دارند */
function go(name,push){
  if(GATED[name] && !FEATURES[GATED[name]]){ toast('این بخش به‌زودی فعال می‌شود ⏳'); return; }
  if(name===curScreen && name!=='home') return;
  if(push!==false && curScreen!==name) navStack.push(curScreen);
  $$('.screen').forEach(function(s){ s.className=s.className.replace(' on',''); });
  var t=$('#s-'+name);
  if(t){ t.className+=' on'; t.scrollTop=0; }
  curScreen=name;
  if(RENDER[name]) RENDER[name]();
}
function back(){
  if(modalOpen){ if(!modalLocked) closeModal(); return true; }
  if(curScreen==='diff' && DG.live){ confirmQuit('diff'); return true; }
  if(curScreen==='guess' && GG.live){ confirmQuit('guess'); return true; }
  if(curScreen==='home'){ return false; }
  var prev = navStack.pop() || 'home';
  go(prev,false);
  return true;
}
function confirmQuit(mode){
  modal({emoji:'🚪',title:'از مرحله خارج می‌شوی؟',
    body:'<div class="dim">پیشرفت این مرحله ذخیره نمی‌شود.</div>',
    buttons:[
      {t:'ادامه بازی',cls:'g'},
      {t:'خروج',cls:'ghost',fn:function(){ if(mode==='diff') stopDiff(); else stopGuess(); go('home',false); navStack=[]; }}
    ]});
}

var MISSIONS=[
  {id:'play', e:'🎮', t:'۵ مرحله بازی کن',            goal:5,  coins:120, score:0},
  {id:'find', e:'🔍', t:'۱۰ تفاوت پیدا کن',           goal:10, coins:150, score:0},

];
function checkMissionsDay(){
  var d=today();
  if(S.missions.date!==d){ S.missions={date:d,p:{},claimed:{}}; save(); }
}
function mission(id,n){
  checkMissionsDay();
  var m=null,i;
  for(i=0;i<MISSIONS.length;i++) if(MISSIONS[i].id===id) m=MISSIONS[i];
  if(!m) return;
  var cur=S.missions.p[id]||0;
  if(cur>=m.goal) return;
  S.missions.p[id]=Math.min(m.goal,cur+n);
  save();
}
function missionsReady(){
  checkMissionsDay();
  var c=0,i,m;
  for(i=0;i<MISSIONS.length;i++){ m=MISSIONS[i];
    if((S.missions.p[m.id]||0)>=m.goal && !S.missions.claimed[m.id]) c++; }
  return c;
}

var DAILY=[
  {c:100,e:'🪙'},{c:150,e:'🪙'},{c:200,e:'🪙'},{c:250,e:'💰'},
  {c:300,e:'💰'},{c:400,e:'💎'},{c:1000,e:'👑',special:true}
];
function dailyReady(){ return S.daily.last!==today(); }
function claimDaily(){
  if(!dailyReady()) return;
  var d = nextDailyDay() || 1;
  S.daily={day:d,last:today()};
  var rw=DAILY[d-1];
  addCoins(rw.c);
  if(rw.special){ S.lives=CFG.MAX_LIVES; S.lifeTs=Date.now(); }
  saveNow();
  Sfx.win(); confetti(36); buzzz(30);
  modal({emoji:rw.e,title:'جایزه روز '+fa(d),
    body:'<div class="rw"><div>🪙 '+fa(rw.c)+' سکه</div>'+
         (rw.special?'<div>❤️ جان کامل</div>':'')+'</div>'+
         '<div class="dim">هر روز بیا تا جایزه بیشتری بگیری!</div>',
    buttons:[{t:'عالیه!',cls:'p',fn:function(){ if(curScreen==='home') RENDER.home(); }}]});
}
function nextDailyDay(){
  var y=new Date(); y.setDate(y.getDate()-1);
  var ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  if(S.daily.last===today()) return 0;              /* امروز گرفته شده */
  return (S.daily.last===ys) ? (S.daily.day%7)+1 : 1;
}
function dailyModal(){
  var nd=nextDailyDay();
  var gotUpTo = (nd===0) ? S.daily.day : nd-1;      /* روزهای دریافت‌شده */
  var h='<div class="dayGrid">',i,st,cls;
  for(i=0;i<7;i++){
    st=DAILY[i];
    cls='day'+(st.special?' big':'');
    if(i+1<=gotUpTo) cls+=' got';
    else if(i+1===nd) cls+=' now';
    h+='<div class="'+cls+'"><div class="n">روز '+fa(i+1)+'</div>'+
       '<div class="c">'+st.e+' '+fa(st.c)+'</div></div>';
  }
  h+='</div>';
  var btns = dailyReady()
    ? [{t:'دریافت جایزه امروز',cls:'p',fn:claimDaily},{t:'بستن',cls:'ghost'}]
    : [{t:'فردا برگرد 🌙',cls:'ghost'}];
  modal({emoji:'🎁',title:'پاداش روزانه',body:h,buttons:btns});
}

/* ---------- ساخت صحنه ---------- */
function rcol(r,a){return [ri(r,a[0],a[1]),ri(r,a[2],a[3]),ri(r,a[4],a[5])];}
function mkObj(r,t,x,y,s,float_){
  var c=rcol(r,COL[t]||[0,360,70,90,55,66]);
  var c2=[(c[0]+ri(r,120,220))%360, clamp(c[1]-10,25,95), clamp(c[2]+ri(r,6,20),30,86)];
  return {t:t,x:q(x),y:q(y),s:q(s),c:c,c2:c2,v:ri(r,0,2),d:0,f:1,fl:float_?1:0};
}
function objSvg(o){
  var fn=PROPS[o.t]; if(!fn) return '';
  var tr='translate('+o.x+','+o.y+') scale('+q(o.s*(o.f||1))+','+o.s+')';
  return '<g transform="'+tr+'">'+fn(o,hsl(o.c),hsl(o.c2))+'</g>';
}
function hot(o){
  var m=META[o.t]||{r:14,oy:0};
  return {x:o.x, y:o.y+(m.oy||0)*o.s, r:Math.max(11,(m.r||14)*o.s)};
}

/* گزینه‌های شدت تفاوت بر اساس سختی */
var DP=[
 {hue:150,sc:[0.55,1.62],tol:9,size:1.00},
 {hue:105,sc:[0.66,1.45],tol:6,size:0.96},
 {hue:70, sc:[0.75,1.32],tol:4,size:0.92},
 {hue:48, sc:[0.82,1.22],tol:2,size:0.88}
];

function build(cfg){
  var r=rng(cfg.n*7919+1234567);
  var th=THEMES[(cfg.n-1)%THEMES.length];
  var dp=DP[cfg.d];
  var bgSvg=bg(th,rng(cfg.n*31+7));
  var i,j,cells=[],x,y,cw,ch;

  /* سلول‌های آسمان (شیءها روی مرکز سلول می‌نشینند) */
  var aTop=(th.ground?16:14), aBot=(th.ground? th.gy-26 : 188);
  var aRows=(th.ground ? (cfg.props>13?3:2) : 4), aCols=4;
  cw=300/aCols; ch=(aBot-aTop)/aRows;
  for(i=0;i<aRows;i++) for(j=0;j<aCols;j++)
    cells.push({air:1, x:j*cw+cw/2+(i%2?cw*0.16:-cw*0.16), y:aTop+i*ch+ch/2,
                jx:cw*0.34, jy:Math.min(ch*0.3,10), s:0.70+(aRows-1-i)*0.05});
  /* سلول‌های زمین: یک ردیف دور (کوچک) و یک ردیف نزدیک (بزرگ)
     فاصله عمودی طوری است که شیءهای دو ردیف روی هم نیفتند */
  if(th.ground){
    var rows=[{y:th.gy+11,s:0.70},{y:191,s:1.00}];
    cw=300/4;
    for(i=0;i<rows.length;i++) for(j=0;j<4;j++)
      cells.push({air:0, x:j*cw+cw/2+(i?cw*0.3:-cw*0.08), y:rows[i].y,
                  jx:cw*0.3, jy:(i?3:5), s:rows[i].s});
  }
  cells=shuffled(r,cells);
  var count=Math.min(cfg.props,cells.length-1);

  var objs=[],pool;
  for(i=0;i<count;i++){
    var cell=cells[i];
    pool = cell.air ? th.air : th.land;
    if(!pool.length) pool=th.air;
    var t=pick(r,pool);
    x = clamp(cell.x+(r()-0.5)*cell.jx, 24, 276);
    y = clamp(cell.y+(r()-0.5)*cell.jy, 15, 197);
    objs.push(mkObj(r,t,x,y,(cell.s+r()*0.16)*dp.size,cell.air));
  }
  /* مرتب‌سازی: آسمان پشت، زمین جلو */
  objs.sort(function(a,b){ return (a.fl?a.y-400:a.y)-(b.fl?b.y-400:b.y); });

  /* ---------- ساخت تفاوت‌ها ---------- */
  var bList=objs.map(function(o){var n={},k;for(k in o)n[k]=o[k];
    n.c=o.c.slice();n.c2=o.c2.slice();return n;});
  var idx=shuffled(r,objs.map(function(o,i2){return i2;}));
  var diffs=[], nd=Math.min(cfg.diffs,objs.length);
  var addOne = (count<cells.length && r()<0.45) ? 1 : 0;
  var mutCount = nd-addOne;

  /* انتخاب شیءهای تفاوت: اول با فاصله زیاد، بعد کم‌کم سخت‌گیری کمتر
     تا هیچ‌وقت دو تفاوت روی هم نیفتند */
  var picks=[], seps=[0.95,0.6,0], si, k, m, okSep, hh, dd;
  for(si=0; si<seps.length && picks.length<mutCount; si++){
    for(k=0; k<idx.length && picks.length<mutCount; k++){
      if(picks.indexOf(idx[k])>=0) continue;
      hh=hot(objs[idx[k]]); okSep=true;
      for(m=0;m<diffs.length;m++){
        dd=Math.sqrt(Math.pow(hh.x-diffs[m].x,2)+Math.pow(hh.y-diffs[m].y,2));
        if(dd < (hh.r+diffs[m].r)*seps[si]){ okSep=false; break; }
      }
      if(!okSep) continue;
      picks.push(idx[k]); diffs.push(hh);
    }
  }
  diffs=[];

  for(i=0;i<picks.length;i++){
    var oi=picks[i], o=objs[oi], b=bList[oi];
    var kinds=['color','color','remove','scale','variant','detail'];
    if((META[o.t]||{}).f) kinds.push('flip');
    var kind=pick(r,kinds);
    if(kind==='color'){
      b.c=[(o.c[0]+dp.hue+ri(r,-14,14)+360)%360, clamp(o.c[1]+ri(r,-8,8),30,95), clamp(o.c[2]+ri(r,-6,6),25,85)];
    }else if(kind==='remove'){
      bList[oi]=null;
    }else if(kind==='scale'){
      b.s=q(o.s*(r()<0.5?dp.sc[0]:dp.sc[1]));
    }else if(kind==='variant'){
      b.v=(o.v+ri(r,1,2))%3;
    }else if(kind==='flip'){
      b.f=-1;
    }else{
      b.d=1; b.c2=[(o.c2[0]+150)%360, clamp(o.c2[1]+10,40,95), clamp(o.c2[2]+8,35,88)];
    }
    diffs.push(hot(o));
  }
  /* یک شیء که فقط در تصویر دوم وجود دارد */
  if(addOne){
    var best=null,bestD=-1;
    for(k=count;k<cells.length;k++){
      var fc=cells[k];
      var fx=clamp(fc.x+(r()-0.5)*fc.jx,24,276), fy=clamp(fc.y,15,197);
      var near=1e9;
      for(m=0;m<diffs.length;m++)
        near=Math.min(near,Math.sqrt(Math.pow(fx-diffs[m].x,2)+Math.pow(fy-diffs[m].y,2)));
      if(near>bestD){ bestD=near; best={c:fc,x:fx,y:fy}; }
    }
    if(best){
      pool = best.c.air ? th.air : th.land;
      if(!pool.length) pool=th.air;
      var ob=mkObj(r,pick(r,pool),best.x,best.y,(best.c.s+0.1)*dp.size,best.c.air);
      bList.push(ob);
      diffs.push(hot(ob));
    }
  }
  bList=bList.filter(function(o){return !!o;});
  bList.sort(function(a,b2){ return (a.fl?a.y-400:a.y)-(b2.fl?b2.y-400:b2.y); });

  return {th:th, bg:bgSvg, a:objs, b:bList, diffs:diffs, tol:dp.tol};
}

function svgOf(scene,side){
  var g=(side==='a')?'gsa':'gsb';
  var t=scene.th;
  var s='<defs><linearGradient id="'+g+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+hsl(t.sky[0])+'"/>'+
    '<stop offset="1" stop-color="'+hsl(t.sky[1])+'"/></linearGradient></defs>';
  s+=scene.bg.replace('%ID%',g);
  var list=(side==='a')?scene.a:scene.b, i;
  for(i=0;i<list.length;i++) s+=objSvg(list[i]);
  s+='<g class="marks"></g>';
  return s;
}
return {build:build, svgOf:svgOf, W:W, H:H, THEMES:THEMES};

var DIFF_NAMES=['آسان','متوسط','سخت','خیلی سخت'];
function levelOf(n){ var t=TUNE.d; return n<=t.e?0 : (n<=t.m?1 : (n<=t.h?2:3)); }
function diffCfg(n){
  var t=TUNE.d, d=levelOf(n), special=(n%10===0);
  var diffs=clamp(t.diffBase+Math.floor((n-1)/t.diffStep),3,t.maxDiff);
  if(special) diffs=Math.min(t.maxDiff,diffs+1);
  return {n:n, d:d, special:special, diffs:diffs,
    time:Math.round(clamp(t.baseTime-n*t.timeDrop,t.minTime,t.baseTime)),
    props:clamp(t.props+Math.floor(n/t.propStep),10,16)};
}
function guessCfg(n){
  var t=TUNE.d, d=levelOf(n), special=(n%10===0);
  return {n:n, d:d, special:special,
    time:Math.round(clamp(t.gTime-n*t.gDrop,t.gMin,t.gTime)),
    blur:[16,20,24,28][d],
    tiles:[10,12,14,16][d]};
}

var DG={live:false,scene:null,cfg:null,found:[],left:0,total:0,hints:0,raf:0,last:0,shown:-1};

function fitScenes(){

  else    { h=(ah-gap)/2; w=h*1.5; if(w>aw){w=aw;h=w/1.5;} }

function dgTick(ts){

function svgPoint(svg,ev){
  var r=svg.getBoundingClientRect();
  var sc=Math.min(r.width/SC.W, r.height/SC.H);
  if(!sc) return {x:-99,y:-99};
  return {x:(ev.clientX-r.left-(r.width-SC.W*sc)/2)/sc,
          y:(ev.clientY-r.top-(r.height-SC.H*sc)/2)/sc};
}
function addMark(cls,d,r){
  ['#svgA','#svgB'].forEach(function(sel){
    var g=$('.marks',$(sel)); if(!g) return;
    var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',d.x); c.setAttribute('cy',d.y);
    c.setAttribute('r',r||d.r); c.setAttribute('class',cls);
    g.appendChild(c);
    if(cls==='hintRing') setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },2500);
  });
}
function addCross(svg,p){
  var g=$('.marks',svg); if(!g) return;
  var k=document.createElementNS('http://www.w3.org/2000/svg','path');
  k.setAttribute('d','M'+(p.x-6)+','+(p.y-6)+'L'+(p.x+6)+','+(p.y+6)+
                 'M'+(p.x+6)+','+(p.y-6)+'L'+(p.x-6)+','+(p.y+6));
  k.setAttribute('class','mkx');
  k.setAttribute('fill','none');
  g.appendChild(k);
  setTimeout(function(){ if(k.parentNode) k.parentNode.removeChild(k); },700);
}
function onSceneTap(ev){
  if(!DG.live) return;
  var svg=(ev.currentTarget===$('#wrapA'))?$('#svgA'):$('#svgB');
  var p=svgPoint(svg,ev), i,d,dx,dy,best=-1,bd=1e9;
  for(i=0;i<DG.scene.diffs.length;i++){
    if(DG.found.indexOf(i)>=0) continue;
    d=DG.scene.diffs[i];
    dx=p.x-d.x; dy=p.y-d.y;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<=d.r+DG.scene.tol && dist<bd){ bd=dist; best=i; }
  }
  if(best>=0){
    DG.found.push(best);
    addMark('mk',DG.scene.diffs[best]);
    Sfx.find(); buzzz(18);
    S.founds++; mission('find',1); save();
    updDiffHud();
    floatPts(ev.clientX,ev.clientY-20,'+'+fa(10),'#43D97B');
    if(DG.found.length>=DG.total) diffWin();
  }else{
    addCross(svg,p);
    Sfx.wrong(); buzzz(45);
    DG.left=Math.max(1200,DG.left-3000);
    var wrap=(svg===$('#svgA'))?$('#wrapA'):$('#wrapB');
    wrap.className='sceneWrap shake';
    setTimeout(function(){ wrap.className='sceneWrap'; },340);
  }
}
function useHint(){
  if(!DG.live) return;
  var rest=[],i;
  for(i=0;i<DG.scene.diffs.length;i++) if(DG.found.indexOf(i)<0) rest.push(i);
  if(!rest.length) return;
  if(!spend(CFG.HINT_COST)) return;
  DG.hints++;
  var d=DG.scene.diffs[rest[Math.floor(Math.random()*rest.length)]];
  addMark('hintRing',d,d.r+7);
  updDiffHud();
  Sfx.tap(); buzzz(15);
}

    body:'<div class="dim">'+fa(DG.found.length)+' از '+fa(DG.total)+' تفاوت را پیدا کردی.</div>',
    buttons:[
      {t:'ادامه با '+fa(CFG.REVIVE_COST)+' 🪙 (+'+fa(30)+' ثانیه)',cls:'p',fn:function(){
        if(!spend(CFG.REVIVE_COST)){ diffTimeUp(); return; }

function diffWin(){
  stopDiff();

    '<span class="'+(stars>0?'on':'')+'">★</span>'+

    '<span class="'+(stars>2?'on':'')+'">★</span></div>';
  modal({emoji:'🎉',title:'آفرین! مرحله تمام شد',dismiss:false,
    body:st+'<div class="rw"><div>⭐ '+fa(pts)+'</div><div>🪙 '+fa(coins)+'</div>'+

function startGuess(n){
  n=clamp(n,1,CFG.TOTAL_STAGES);
  stopGuess();
  regenLives();
  if(S.lives<=0){ go('guess'); renderLives(); noLives(function(){ startGuess(n); }); return; }
  var cfg=guessCfg(n);
  var r=rng(n*104729+77);
  var item=ITEMS[ITEM_ORDER[(n-1)%ITEMS.length]];
  /* گزینه‌های اشتباه از همان دسته */
  var same=BY_CAT[item[2]].filter(function(i){ return ITEMS[i]!==item; });
  var wrongs=shuffled(r,same).slice(0,3), i;
  if(wrongs.length<3){
    var all=shuffled(r,ITEM_ORDER);
    for(i=0;i<all.length && wrongs.length<3;i++)
      if(ITEMS[all[i]]!==item && wrongs.indexOf(all[i])<0) wrongs.push(all[i]);
  }
  var opts=shuffled(r,[item].concat(wrongs.map(function(i2){return ITEMS[i2];})));

  GG.cfg=cfg; GG.item=item; GG.opts=opts;

function ensureBoard(){
  var i,r;
  if(!S.board||!S.board.length){
    r=rng(987654321);
    var names=shuffled(r,BOT_NAMES), avs=shuffled(r,AVATARS);
    S.board=[];
    for(i=0;i<20;i++) S.board.push({n:names[i%names.length],a:avs[i%avs.length],
      s:Math.round(350+Math.pow(20-i,2.3)*8+r()*250)});
    S.boardDay=dayNum(); save();
  }
  var d=dayNum();
  if(S.boardDay!==d){
    var days=clamp(d-(S.boardDay||d),1,7);
    r=rng(d*31+7);
    for(i=0;i<S.board.length;i++) S.board[i].s+=Math.round((25+r()*95)*days);
    S.boardDay=d; save();
  }
}

/* --- صفحه‌کلید رمز --- */
function pinPrompt(o){
  var buf='';
  var pad='';
  var keys=['۱','۲','۳','۴','۵','۶','۷','۸','۹','⌫','۰','✓'];
  var vals=['1','2','3','4','5','6','7','8','9','del','0','ok'];
  var i;
  for(i=0;i<keys.length;i++) pad+='<button data-k="'+vals[i]+'">'+keys[i]+'</button>';
  var m=modal({emoji:'🔐',title:o.title,dismiss:false,
    body:'<div class="dim" style="font-size:12.5px;line-height:1.9">'+o.sub+'</div>'+
      '<div class="pinBox" id="pinDots"></div>'+
      '<div class="keypad" id="pinPad">'+pad+'</div>'+
      (o.link?'<button class="btn ghost sm" style="margin-top:9px" id="pinLink">'+o.link+'</button>':''),
    buttons:[{t:'انصراف',cls:'ghost',fn:function(){ if(o.onCancel) o.onCancel(); }}]});
  function dots(){
    var h='',j;
    for(j=0;j<8;j++) h+='<i class="'+(j<buf.length?'on':'')+'"></i>';
    $('#pinDots',m).innerHTML=h;
  }
  dots();
  $$('#pinPad button',m).forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-k');
      Sfx.tap();
      if(k==='del'){ buf=buf.slice(0,-1); dots(); return; }
      if(k==='ok'){
        if(buf.length<4){ toast('رمز حداقل ۴ رقم باشد'); Sfx.wrong(); return; }
        var val=buf; buf=''; dots();
        $('#pinPad',m).innerHTML='<div class="dim" style="grid-column:1/-1;padding:14px">بررسی…</div>';
        setTimeout(function(){ o.onSubmit(val); },30);
        return;
      }
      if(buf.length>=8) return;
      buf+=k; dots();
    });
  });
  if(o.link) $('#pinLink',m).addEventListener('click',function(){ Sfx.tap(); o.onLink(); });
  return m;
}
function adminGate(){
  if(SEC.open()){ go('admin'); return; }
  if(!SEC.isSet()){ adminSetup(); return; }
  var wait=SEC.lockedFor();
  if(wait>0){
    modal({emoji:'⛔',title:'ورود قفل است',
      body:'<div class="warnBox">به دلیل تلاش‌های ناموفق، ورود موقتاً قفل شده است.<br>'+
        'زمان باقی‌مانده: <b id="lockCt">'+mmss(wait/1000)+'</b></div>',
      buttons:[{t:'باشه',cls:'ghost'}]});
    return;
  }
  pinPrompt({
    title:'ورود به پنل مدیریت',
    sub:'رمز عبور مدیر را وارد کن.'+(SEC.fails()?'<br>تلاش ناموفق: '+fa(SEC.fails()):''),
    link:'رمز را فراموش کرده‌ام',
    onLink:function(){ closeModal(); adminRecover(); },
    onSubmit:function(pin){
      var r=SEC.check(pin);
      closeModal();
      if(r==='ok'){ Sfx.win(); toast('خوش آمدی مدیر 👑'); go('admin'); }
      else if(r==='lock'){ Sfx.wrong(); adminGate(); }
      else if(r==='wiped'){
        Sfx.lose();
        modal({emoji:'🧹',title:'پاک‌سازی امنیتی',
          body:'<div class="warnBox">به دلیل تلاش‌های ناموفق زیاد، رمز مدیر پاک شد. '+
            'دفعه بعد باید رمز تازه بسازی.</div>',buttons:[{t:'باشه',cls:'ghost'}]});
      } else {
        Sfx.wrong(); buzzz(80);
        var w=SEC.lockedFor();
        toast(w>0?'رمز اشتباه! قفل تا '+mmss(w/1000):'رمز اشتباه است!');
      }
    }
  });
}
function adminSetup(){
  pinPrompt({
    title:'ساخت رمز مدیر',
    sub:'یک رمز ۴ تا ۸ رقمی بساز. این رمز فقط روی همین گوشی ذخیره می‌شود و '+
        'به صورت رمزنگاری‌شده (PBKDF2) نگهداری می‌گردد.',
    onSubmit:function(pin1){
      closeModal();
      pinPrompt({
        title:'تکرار رمز',
        sub:'برای اطمینان، همان رمز را دوباره وارد کن.',
        onSubmit:function(pin2){
          closeModal();
          if(pin1!==pin2){ Sfx.wrong(); toast('دو رمز یکی نیستند!'); adminSetup(); return; }
          var rec=SEC.setPin(pin1);

            body:'<div class="warnBox">این کد را جایی امن یادداشت کن. اگر رمز را فراموش کردی، '+

              '<div class="sec mono" style="margin-top:9px;font-size:17px;text-align:center">'+rec+'</div>',
            buttons:[{t:'یادداشت کردم، ادامه',cls:'p',fn:function(){ adminGate(); }}]});
        }

    }

}

  var m=modal({emoji:'🗝️',title:'بازیابی با کد پشتیبان',
    body:'<div class="dim" style="font-size:12.5px">کد ۱۰ حرفی که هنگام ساخت رمز گرفتی را وارد کن.</div>'+

/* --- ابزارهای ساخت فرم --- */
function fr(label,inp){ return '<div class="frow"><span>'+label+'</span>'+inp+'</div>'; }
function ni(id,val,min,max,step){
  return '<input class="inp" id="'+id+'" type="number" value="'+val+'" min="'+min+
         '" max="'+max+'" step="'+(step||1)+'">';
}
function ti(id,val,ph){
  return '<input class="inp wide" id="'+id+'" value="'+esc(val)+'" placeholder="'+(ph||'')+'">';
}
function gv(id,def){
  var e=$('#'+id);
  if(!e) return def;
  var v=parseFloat(String(e.value).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);}));
  return isNaN(v)?def:v;
}

    S.sound=!S.sound; saveNow();
    if(S.sound){ Sfx.unlockAudio(); Sfx.coin(); }
    toast(S.sound?'صدا روشن شد 🔊':'صدا خاموش شد 🔇');
    if(curScreen==='home') RENDER.home(); else if(curScreen==='profile') RENDER.profile();
  },
  claim:function(b){
    var id=b.getAttribute('data-id'),m=null,i;
    for(i=0;i<MISSIONS.length;i++) if(MISSIONS[i].id===id) m=MISSIONS[i];
    if(!m||S.missions.claimed[id]) return;
    if((S.missions.p[id]||0)<m.goal) return;
    S.missions.claimed[id]=1;
    addCoins(m.coins); if(m.score) addScore(m.score);
    saveNow(); Sfx.win(); confetti(22);
    toast('جایزه گرفتی! '+fa(m.coins)+' 🪙');
    RENDER.missions();
  },
  admin:function(){ adminGate(); },
  reset:function(){
    modal({emoji:'⚠️',title:'مطمئنی؟',
      body:'<div class="dim">همه پیشرفت، سکه‌ها و امتیازها پاک می‌شود.</div>',
      buttons:[
        {t:'نه، بی‌خیال',cls:'g'},
        {t:'بله، پاک کن',cls:'k',fn:function(){
          S=freshState(); saveNow(); ensureBoard();
          toast('بازی از نو شروع شد');
          go('home',false); navStack=[];
        }}
      ]});
  }
};

ACT.aDiff=function(){

  d.minTime=clamp(gv('dmt',d.minTime)|0,5,d.baseTime);

  d.diffStep=clamp(gv('dds',d.diffStep)|0,1,100);
  d.maxDiff=clamp(gv('ddm',d.maxDiff)|0,3,10);
  d.props=clamp(gv('dp',d.props)|0,6,16);
  d.propStep=clamp(gv('dps',d.propStep)|0,1,100);

ACT.aMissions=function(){

  for(i=0;i<MISSIONS.length;i++){
    var m={},k;

    m.goal=clamp(gv('mg'+i,m.goal)|0,1,999);
    m.coins=Math.max(0,gv('mc'+i,m.coins)|0);
    m.score=Math.max(0,gv('ms'+i,m.score)|0);

ACT.aDaily=function(){
  var i,out=[];
  for(i=0;i<7;i++) out.push({c:Math.max(0,gv('dr'+i,DAILY[i].c)|0),e:DAILY[i].e,special:!!DAILY[i].special});
  TUNE.daily=out; DAILY=out;
  aDone('پاداش‌ها ذخیره شد','تغییر پاداش روزانه');
};
ACT.aBackup=function(){
  var payload={v:1,t:Date.now(),team:TEAM.name,state:S,tune:TUNE};
  var body=JSON.stringify(payload);
  var pack={sum:CRYPTO.sha256hex(body).slice(0,16),body:body};
  $('#bkOut').value=JSON.stringify(pack);
  SEC.log('ساخت پشتیبان');
  toast('پشتیبان ساخته شد — کپی کن');
};
ACT.aRestore=function(){
  var raw=($('#bkIn').value||'').trim();
  if(!raw){ toast('متن پشتیبان خالی است'); return; }
  var pack;
  try{ pack=JSON.parse(raw); }catch(e){ toast('متن پشتیبان خراب است!'); Sfx.wrong(); return; }
  if(!pack||!pack.body||!pack.sum){ toast('ساختار پشتیبان درست نیست!'); Sfx.wrong(); return; }
  if(!CRYPTO.same(CRYPTO.sha256hex(pack.body).slice(0,16),String(pack.sum))){
    Sfx.wrong();
    modal({emoji:'⚠️',title:'کد کنترلی نمی‌خواند',
      body:'<div class="warnBox">این فایل پشتیبان دست‌کاری شده یا ناقص است. '+
        'بازگردانی می‌تواند بازی را خراب کند.</div>',
      buttons:[{t:'بی‌خیال',cls:'g'},{t:'با این حال بازگردان',cls:'k',fn:function(){ doRestore(pack.body); }}]});
    return;
  }
  doRestore(pack.body);
};
function doRestore(body){
  var p;
  try{ p=JSON.parse(body); }catch(e){ toast('پشتیبان خراب است'); return; }
  noSave=true;
  if(p.state){ try{ localStorage.setItem(KEY,JSON.stringify(p.state)); }catch(e){} }
  if(p.tune){ try{ localStorage.setItem(TKEY,JSON.stringify(p.tune)); }catch(e){} }
  SEC.log('بازگردانی پشتیبان');
  toast('بازگردانی شد، بازی دوباره باز می‌شود…');
  setTimeout(function(){ location.reload(); },700);
}

    onSubmit:function(old){

      pinPrompt({title:'رمز تازه',sub:'رمز تازه را وارد کن (۴ تا ۸ رقم).',

                buttons:[{t:'یادداشت کردم',cls:'p',fn:function(){ RENDER.admin(); }}]});

        }});

/* ============================================================
   ۱۵) راه‌اندازی
   ============================================================ */
var resizeRaf=0;
function onResize(){
  if(resizeRaf) cancelAnimationFrame(resizeRaf);
  resizeRaf=requestAnimationFrame(function(){
    resizeRaf=0;
    if(curScreen==='diff') fitScenes();
    if(curScreen==='guess'){ fitPic(); if(GG.tiles.length) paintPic(); }
  });
}
function ticker(){
  var before=S.lives;
  regenLives();
  var ct=$('#lifeCt');
  if(ct) ct.textContent=mmss(lifeLeftMs()/1000);
  var lc=$('#lockCt');
  if(lc) lc.textContent=mmss(SEC.lockedFor()/1000);
  if(curScreen==='admin' && !SEC.open()){
    toast('نشست مدیریت بسته شد 🔒'); go('about',false);
  }
  if(curScreen==='home'){
    var e=$('#homeLife');
    if(e) e.textContent=lifeText();
    if(before!==S.lives) RENDER.home();
  }else if(curScreen==='guess' && before!==S.lives){
    renderLives();
  }
  if(before!==S.lives) save();
}
function welcome(){
  modal({emoji:'👑',title:'به سلطان معما خوش آمدی!',dismiss:false,
    body:'<div style="text-align:right;font-size:14px;line-height:2">'+
      '🔍 <b>پیدا کردن تفاوت:</b> دو تصویر را مقایسه کن و تفاوت‌ها را لمس کن.<br>'+
      '🖼️ <b>حدس تصویر:</b> تصویر تار می‌شود و باید حدس بزنی چیست.<br>'+
      '🪙 با سکه‌ها راهنما بگیر و ⭐ امتیاز جمع کن تا سلطان معما شوی!</div>',
    buttons:[{t:'بزن بریم! 🚀',cls:'p',fn:function(){
      if(dailyReady()) setTimeout(dailyModal,300);
    }}]});
}
function boot(){
  var firstRun=false;
  try{ firstRun=!localStorage.getItem(KEY); }catch(e){ firstRun=true; }
  SEC.init();
  tuneLoad();
  tuneApply();
  load();
  ensureBoard();

  $$('[data-back]').forEach(function(b){
    b.addEventListener('click',function(){ Sfx.tap(); back(); });
  });
  $('#wrapA').addEventListener('click',onSceneTap);
  $('#wrapB').addEventListener('click',onSceneTap);
  $('#dHint').addEventListener('click',useHint);
  $('#gFifty').addEventListener('click',useFifty);
  $('#gClear').addEventListener('click',useClear);

  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',function(){ setTimeout(onResize,260); });
  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ DG.last=0; GG.last=0; saveNow(); SEC.lockNow(); }
  });
  window.addEventListener('pagehide',saveNow);

  var unlocked=false;
  document.addEventListener('touchstart',function u(){
    if(unlocked) return; unlocked=true; Sfx.unlockAudio();
  },{passive:true});
  document.addEventListener('mousedown',function(){ if(!unlocked){unlocked=true;Sfx.unlockAudio();} });

  setInterval(ticker,1000);
  go('home',false);

  if(firstRun) setTimeout(welcome,350);
  else if(dailyReady()) setTimeout(dailyModal,450);
}
/* برای تست و توسعه */
window.SM={
  state:function(){return S;}, cfgDiff:diffCfg, cfgGuess:guessCfg,
  go:go, diff:startDiff, guess:startGuess, scene:SC,
  dg:function(){return DG;}, gg:function(){return GG;},
  save:saveNow, items:function(){return ITEMS;}, cfg:function(){return CFG;},
  sec:SEC, crypto:CRYPTO, tune:function(){return TUNE;},
  admin:function(){ adminGate(); }, features:FEATURES, team:TEAM
};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
